<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exhibit asset card</title>
<!-- One template for every generated image (scripts/build_assets.sh renders it
     in headless Chrome). ?mode=cover|end|lower|section|caption|gallery, plus
     name/site/repo from design/assets/brand.json. Tokens: design/DESIGN.md. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root { --manila:#E9D5A4; --tab:#D9BE80; --paper:#FFFFFF; --ink:#111111; --ink2:#4A4234; --faint:#D8CDB6; --yellow:#FFD400; --tape:#111111; --ontape:#FFD400; --red:#C8102E; --blue:#1D3FA6; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--manila); color: var(--ink); font-family: "Courier Prime", monospace; }
body.clear { background: transparent; }
.A { font-family: "Archivo", sans-serif; font-stretch: 62%; font-weight: 900; text-transform: uppercase; }
.tape { position: absolute; left: -40px; right: -40px; top: 64px; background: var(--tape); color: var(--ontape); font: 800 28px/1 "Archivo"; font-stretch: 62%; letter-spacing: .2em; white-space: nowrap; overflow: hidden; padding: 16px 0; transform: rotate(-1.2deg); }
.sticker { position: absolute; background: var(--yellow); color: var(--ink); border-radius: 12px; text-align: center; padding: 12px 26px 16px; transform: rotate(4deg); box-shadow: 3px 5px 0 rgba(0,0,0,.18); }
.sticker small { display: block; font: 800 26px "Archivo"; font-stretch: 75%; letter-spacing: .14em; }
.sticker b { display: block; font: 900 120px/1 "Archivo"; font-stretch: 62%; }
.sticker span { display: block; font: 800 22px "Archivo"; font-stretch: 75%; letter-spacing: .1em; border-top: 3px solid currentColor; margin-top: 6px; padding-top: 4px; }
.stamp { position: absolute; color: var(--red); border: 12px solid currentColor; padding: 10px 36px 16px; transform: rotate(-10deg); text-align: center; filter: url(#ink); }
.stamp b { display: block; font: 900 170px/1 "Archivo"; font-stretch: 62%; letter-spacing: .06em; }
.stamp small { display: block; font: 800 34px "Archivo"; font-stretch: 75%; letter-spacing: .16em; border-top: 5px solid currentColor; margin-top: 8px; padding-top: 6px; }
.card { position: absolute; background: var(--paper); box-shadow: 0 2px 0 var(--faint), 0 12px 0 -6px var(--faint); }
.label { font: 800 24px "Archivo"; font-stretch: 75%; letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.stmt { font: 700 58px/1.35 "Courier Prime"; }
.ring { color: var(--red); border: 6px solid var(--red); border-radius: 999px; padding: 0 .25em; white-space: nowrap; }
.head { position: absolute; font: 900 132px/.95 "Archivo"; font-stretch: 62%; text-transform: uppercase; letter-spacing: .01em; }
.wm { position: absolute; font: 900 92px/1 "Archivo"; font-stretch: 62%; text-transform: uppercase; letter-spacing: .02em; }
.fine { font: 400 26px/1.4 "Courier Prime"; color: var(--ink2); }
mark { background: var(--yellow); color: var(--ink); padding: 0 .1em; }
/* lower third */
.lower { position: absolute; left: 96px; bottom: 110px; background: var(--paper); border-left: 10px solid var(--ink); padding: 22px 34px 24px 28px; box-shadow: 0 2px 0 var(--faint), 0 10px 0 -5px var(--faint); }
.lower b { display: block; font: 900 60px/1 "Archivo"; font-stretch: 62%; text-transform: uppercase; letter-spacing: .02em; }
.lower span { display: block; font: 400 30px/1.3 "Courier Prime"; margin-top: 8px; }
/* section tab */
.sec { position: absolute; left: 72px; top: 56px; background: var(--tab); border-radius: 16px 16px 0 0; padding: 18px 36px 16px; border-bottom: 6px solid var(--ink); }
.sec small { display: block; font: 800 24px "Archivo"; font-stretch: 75%; letter-spacing: .14em; color: var(--ink2); }
.sec b { display: block; font: 900 64px/1 "Archivo"; font-stretch: 62%; text-transform: uppercase; }
/* caption label: grey, dashed, never red */
.cap { position: absolute; right: 72px; top: 60px; color: var(--ink); background: var(--paper); border: 6px dashed var(--ink2); padding: 12px 24px; transform: rotate(-3deg); text-align: center; }
.cap b { display: block; font: 900 46px/1 "Archivo"; font-stretch: 62%; letter-spacing: .08em; text-transform: uppercase; }
.cap span { display: block; font: 400 24px/1.3 "Courier Prime"; margin-top: 6px; max-width: 620px; }
/* gallery */
.gtab { position: absolute; left: 72px; top: 40px; background: var(--paper); border-radius: 16px 16px 0 0; padding: 18px 32px 14px; }
.gtab b { font: 900 52px/1 "Archivo"; font-stretch: 62%; text-transform: uppercase; }
.gtab span { font: 400 28px "Courier Prime"; color: var(--ink2); margin-left: 18px; }
.gshot { position: absolute; left: 72px; right: 72px; top: 120px; bottom: 56px; background: var(--paper); overflow: hidden; box-shadow: 0 2px 0 var(--faint), 0 12px 0 -6px var(--faint); }
.gshot img { width: 100%; display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter></svg>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const NAME = q.get("name") || "", SITE = q.get("site") || "", REPO = q.get("repo") || "";
const mode = q.get("mode") || "cover";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const tape = `<div class="tape">${"EVIDENCE · DO NOT TAMPER · ".repeat(14)}</div>`;
// The hero exhibit: Qwen 2.5 7B's claim against Tesla's 10-Q (claim 6 of the published round).
const exhibit = (top) => `
  <div class="card" style="left:120px;top:${top}px;width:1060px;padding:44px 52px 46px">
    <div class="label">AI claim · checked against Tesla's 10-Q</div>
    <div class="stmt" style="margin-top:22px">Depreciation for <span class="ring">Q3 2026</span> was $1.37&nbsp;billion.</div>
    <div class="fine" style="margin-top:26px">The filing: <mark>three and six months ended June 30, 2026</mark>.<br>acc. no. 0001628280-26-049270</div>
  </div>
  <div class="sticker" style="left:1110px;top:${top - 50}px"><small>EXHIBIT</small><b>6</b><span>TSLA</span></div>`;
const R = {
  cover: () => `${tape}
    <div class="head" style="left:120px;top:190px;width:1700px">A citation check for<br>AI-written research.</div>
    ${exhibit(500)}
    <div class="stamp" style="left:1290px;top:620px;font-size:0"><b style="font-size:128px">SLASHED</b><small>WRONG QUARTER</small></div>
    <div class="fine" style="position:absolute;left:120px;bottom:44px">Chainlink CRE · SEC EDGAR · BLI Legal Tech Hackathon 2</div>
    <div class="wm" style="right:110px;bottom:34px">${esc(NAME)}</div>`,
  end: () => `${tape}
    <div class="head" style="left:120px;top:190px;width:1700px;font-size:112px">If it's wrong, it costs you.<br>If you trade on it,<br>the record shows why.</div>
    <div class="card" style="left:120px;top:640px;width:1100px;padding:40px 48px">
      <div class="label">Read the records</div>
      <div class="stmt" style="font-size:52px;margin-top:16px">${esc(SITE)}</div>
      <div class="fine" style="margin-top:14px">${esc(REPO)}</div>
    </div>
    <div class="sticker" style="left:1330px;top:640px"><small>EXHIBIT</small><b>6</b><span>TSLA</span></div>
    <div class="wm" style="right:110px;bottom:34px">${esc(NAME)}</div>`,
  lower: () => `<div class="lower"><b>${esc(q.get("who") || "")}</b><span>${esc((q.get("role") || "").replace("{name}", NAME))}</span></div>`,
  section: () => `<div class="sec"><small>${esc(q.get("n") || "")}</small><b>${esc(q.get("title") || "")}</b></div>`,
  caption: () => `<div class="cap"><b>${esc(q.get("title") || "")}</b>${q.get("sub") ? `<span>${esc(q.get("sub"))}</span>` : ""}</div>`,
  gallery: () => `<div class="gtab"><b>${esc(q.get("title") || "")}</b><span>${esc(q.get("sub") || "")}</span></div>
    <div class="gshot"><img src="${esc(q.get("img") || "")}" alt=""></div>`,
};
if (["lower", "section", "caption"].includes(mode)) { document.body.classList.add("clear"); document.documentElement.style.background = "transparent"; }
document.getElementById("root").innerHTML = (R[mode] || R.cover)();
document.title = `${NAME} ${mode}`;
</script>
</body>
</html>
